name: Veracity UAT
description: Run WebdriverIO UAT specs with cached AI actions and upload reports.
inputs:
  url:
    description: Website URL reachable from the runner.
    required: true
  tests:
    description: Directory with .e2e.js, .e2e.mjs, or .e2e.ts specs.
    required: true
  provider:
    description: AI model provider.
    default: openai
  model:
    description: AI model name.
    default: gpt-5.6-luna
  base-url:
    description: Custom model API endpoint.
  workers:
    description: Number of concurrent spec workers.
    default: '1'
  cache-dir:
    description: Directory for AI action recordings, relative to the workspace.
    default: .veracity/act
  cache:
    description: AI cache mode (write, heal, locked, or off).
    default: write
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install Veracity
      shell: bash
      env:
        VERACITY_PATH: ${{ github.action_path }}
      run: npm ci --prefix "$VERACITY_PATH" --omit=dev
    - name: Restore action recordings
      id: recordings
      uses: actions/cache/restore@v4
      with:
        path: ${{ inputs.cache-dir }}
        key: veracity-act-${{ runner.os }}-${{ inputs.tests }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: veracity-act-${{ runner.os }}-${{ inputs.tests }}-
    - name: Run UAT
      shell: bash
      env:
        VERACITY_PATH: ${{ github.action_path }}
        UAT_URL: ${{ inputs.url }}
        UAT_TESTS: ${{ inputs.tests }}
        UAT_PROVIDER: ${{ inputs.provider }}
        UAT_BASE_URL: ${{ inputs.base-url }}
        UAT_MODEL: ${{ inputs.model }}
        UAT_WORKERS: ${{ inputs.workers }}
        UAT_CACHE_DIR: ${{ inputs.cache-dir }}
        UAT_CACHE: ${{ inputs.cache }}
      run: node "$VERACITY_PATH/veracity.js" --url "$UAT_URL" --tests "$UAT_TESTS" --provider "$UAT_PROVIDER" --model "$UAT_MODEL" --base-url "$UAT_BASE_URL" --workers "$UAT_WORKERS" --cache-dir "$UAT_CACHE_DIR" --cache "$UAT_CACHE"
    - name: Save action recordings
      if: ${{ always() && steps.recordings.outcome == 'success' && inputs.cache == 'write' }}
      uses: actions/cache/save@v4
      with:
        path: ${{ inputs.cache-dir }}
        key: ${{ steps.recordings.outputs.cache-primary-key }}
    - name: Upload UAT results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: veracity-uat
        include-hidden-files: true
        path: |
          veracity-output/
          ${{ inputs.cache-dir }}/
