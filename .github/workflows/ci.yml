name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VERACITY_PROVIDER: ${{ vars.VERACITY_PROVIDER }}
          VERACITY_MODEL: ${{ vars.VERACITY_MODEL }}
          VERACITY_BASE_URL: ${{ vars.VERACITY_BASE_URL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: veracity-output/
