[project]
name = "veracity"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "browser-use>=0.13.14",
  "GitPython>=3.2.1",
  "openai-codex>=0.163.0",
  "pydantic>=2.13.5",
  "rich==14.3.3",
  "typer>=0.27.3",
]

[project.scripts]
veracity = "veracity:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["veracity.py"]

[dependency-groups]
dev = ["ruff>=0.16.8"]

[tool.ruff]
line-length = 120